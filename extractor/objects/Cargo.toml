[package]
name = "wtv-objects"
version = "0.1.0"
edition = "2021"
description = "Placed objects (buildings) of War Thunder levels for the WT ballistic visualizer"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wt-unpack's library, cloned under i18n_src/wt-unpack-src
wt-unpack = { path = "../../i18n_src/wt-unpack-src" }
wt-formats = "0.1.0"

[profile.release]
opt-level = 3
